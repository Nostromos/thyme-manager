<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#84cc16;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#65a30d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4d7c0f;stop-opacity:1" />
    </linearGradient>
    
    <!-- Pattern for decorative elements -->
    <pattern id="herbPattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Small thyme leaves -->
      <g opacity="0.15">
        <ellipse cx="20" cy="20" rx="3" ry="5" fill="#fff" transform="rotate(45 20 20)"/>
        <ellipse cx="25" cy="18" rx="2" ry="4" fill="#fff" transform="rotate(30 25 18)"/>
        <ellipse cx="15" cy="22" rx="2" ry="4" fill="#fff" transform="rotate(-30 15 22)"/>
        <line x1="20" y1="25" x2="20" y2="30" stroke="#fff" stroke-width="1"/>
      </g>
      <g opacity="0.15" transform="translate(50, 40)">
        <ellipse cx="20" cy="20" rx="3" ry="5" fill="#fff" transform="rotate(-45 20 20)"/>
        <ellipse cx="25" cy="18" rx="2" ry="4" fill="#fff" transform="rotate(-60 25 18)"/>
        <ellipse cx="15" cy="22" rx="2" ry="4" fill="#fff" transform="rotate(60 15 22)"/>
        <line x1="20" y1="25" x2="20" y2="30" stroke="#fff" stroke-width="1"/>
      </g>
    </pattern>
  </defs>
  
  <!-- Main background -->
  <rect width="800" height="200" fill="url(#bgGradient)"/>
  <rect width="800" height="200" fill="url(#herbPattern)"/>
  
  <!-- Dark overlay for better text contrast -->
  <rect width="800" height="200" fill="#000" opacity="0.1"/>
  
  <!-- Thyme sprig icon in center -->
  <g transform="translate(380, 35)">
    <!-- Main stem -->
    <line x1="20" y1="10" x2="20" y2="50" stroke="#fff" stroke-width="3" opacity="0.9"/>
    <!-- Leaves -->
    <g fill="#fff" opacity="0.9">
      <ellipse cx="15" cy="15" rx="4" ry="7" transform="rotate(-30 15 15)"/>
      <ellipse cx="25" cy="18" rx="4" ry="7" transform="rotate(30 25 18)"/>
      <ellipse cx="14" cy="25" rx="4" ry="7" transform="rotate(-40 14 25)"/>
      <ellipse cx="26" cy="28" rx="4" ry="7" transform="rotate(40 26 28)"/>
      <ellipse cx="13" cy="35" rx="4" ry="7" transform="rotate(-35 13 35)"/>
      <ellipse cx="27" cy="38" rx="4" ry="7" transform="rotate(35 27 38)"/>
      <ellipse cx="15" cy="44" rx="3" ry="6" transform="rotate(-30 15 44)"/>
      <ellipse cx="25" cy="46" rx="3" ry="6" transform="rotate(30 25 46)"/>
    </g>
  </g>
  
  <!-- Main title -->
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#fff">
    Thyme Manager
  </text>
  
  <!-- Subtitle with pun emphasis -->
  <text x="400" y="160" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#fff" opacity="0.95">
    It's about thyme you organized those recipes!
  </text>
  
  <!-- Clock icon (for the time pun) -->
  <g transform="translate(150, 80)" opacity="0.25">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#fff" stroke-width="3"/>
    <line x1="20" y1="20" x2="20" y2="8" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="20" x2="28" y2="25" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="20" r="2" fill="#fff"/>
  </g>
  
  <!-- Chef hat -->
  <g transform="translate(600, 75)" opacity="0.25">
    <path d="M30 15c-4.4 0-8 3.6-8 8 0 0.9 0.2 1.8 0.4 2.6-1.2-0.6-2.6-1-4-1-4.4 0-8 3.6-8 8s3.6 8 8 8h0.4v12c0 2.2 1.8 4 4 4h14.4c2.2 0 4-1.8 4-4v-12h0.4c4.4 0 8-3.6 8-8s-3.6-8-8-8c-1.4 0-2.8 0.4-4 1 0.2-0.8 0.4-1.7 0.4-2.6 0-4.4-3.6-8-8-8z" 
          fill="#fff"/>
  </g>
  
  <!-- Calendar pages -->
  <g transform="translate(180, 120)" opacity="0.2">
    <rect x="0" y="5" width="25" height="20" rx="2" fill="#fff"/>
    <rect x="4" y="0" width="3" height="6" fill="#fff"/>
    <rect x="18" y="0" width="3" height="6" fill="#fff"/>
  </g>
  
  <!-- Recipe cards -->
  <g transform="translate(595, 120)" opacity="0.2">
    <rect x="0" y="0" width="20" height="28" rx="2" fill="#fff" transform="rotate(-5 10 14)"/>
    <rect x="5" y="-2" width="20" height="28" rx="2" fill="#fff" transform="rotate(5 15 12)"/>
  </g>
</svg>