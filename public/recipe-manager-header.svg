<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    
    <!-- Pattern for decorative elements -->
    <pattern id="foodPattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="#fff" opacity="0.1"/>
      <circle cx="70" cy="50" r="2" fill="#fff" opacity="0.1"/>
      <circle cx="45" cy="80" r="2" fill="#fff" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Main background -->
  <rect width="800" height="200" fill="url(#bgGradient)"/>
  <rect width="800" height="200" fill="url(#foodPattern)"/>
  
  <!-- Dark overlay for better text contrast -->
  <rect width="800" height="200" fill="#000" opacity="0.2"/>
  
  <!-- Chef hat icon -->
  <g transform="translate(350, 40)">
    <path d="M50 20c-5.5 0-10 4.5-10 10 0 1.1.2 2.2.5 3.2-1.5-.8-3.2-1.2-5-1.2-5.5 0-10 4.5-10 10s4.5 10 10 10h.5v15c0 2.8 2.2 5 5 5h18c2.8 0 5-2.2 5-5v-15h.5c5.5 0 10-4.5 10-10s-4.5-10-10-10c-1.8 0-3.5.5-5 1.2.3-1 .5-2.1.5-3.2 0-5.5-4.5-10-10-10z" 
          fill="#fff" opacity="0.9"/>
    <rect x="40" y="67" width="20" height="8" fill="#fff" opacity="0.9"/>
  </g>
  
  <!-- Main title -->
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="42" font-weight="bold" text-anchor="middle" fill="#fff">
    Recipe Manager
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="160" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#fff" opacity="0.9">
    Plan. Prep. Enjoy.
  </text>
  
  <!-- Decorative elements - utensils -->
  <g transform="translate(150, 80)" opacity="0.3">
    <!-- Fork -->
    <rect x="0" y="0" width="3" height="40" fill="#fff"/>
    <rect x="0" y="0" width="3" height="10" fill="#fff" transform="translate(5, 0)"/>
    <rect x="0" y="0" width="3" height="10" fill="#fff" transform="translate(10, 0)"/>
    <rect x="0" y="0" width="13" height="3" fill="#fff"/>
  </g>
  
  <g transform="translate(630, 80)" opacity="0.3">
    <!-- Spoon -->
    <ellipse cx="6" cy="8" rx="6" ry="10" fill="#fff"/>
    <rect x="4" y="16" width="4" height="24" fill="#fff"/>
  </g>
  
  <!-- Calendar icon -->
  <g transform="translate(200, 120)" opacity="0.3">
    <rect x="0" y="5" width="30" height="25" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="5" y="0" width="4" height="8" fill="#fff"/>
    <rect x="21" y="0" width="4" height="8" fill="#fff"/>
    <line x1="0" y1="12" x2="30" y2="12" stroke="#fff" stroke-width="2"/>
  </g>
  
  <!-- Recipe book icon -->
  <g transform="translate(570, 120)" opacity="0.3">
    <rect x="0" y="0" width="25" height="35" rx="2" fill="none" stroke="#fff" stroke-width="2"/>
    <line x1="5" y1="8" x2="20" y2="8" stroke="#fff" stroke-width="1"/>
    <line x1="5" y1="13" x2="20" y2="13" stroke="#fff" stroke-width="1"/>
    <line x1="5" y1="18" x2="15" y2="18" stroke="#fff" stroke-width="1"/>
  </g>
</svg>